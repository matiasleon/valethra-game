<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Valethra QA Review</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      video { width: 100%; height: 100%; object-fit: contain; }
      output { position: fixed; top: 12px; right: 14px; padding: 5px 8px; color: #fff; background: #000a; font: 12px monospace; }
    </style>
  </head>
  <body>
    <video id="recording" muted playsinline></video>
    <output id="time"></output>
    <script>
      const video = document.querySelector("#recording");
      const output = document.querySelector("#time");
      const params = new URLSearchParams(location.search);
      video.src = `./${params.get("file") ?? "valethra-autoplay-60fps.webm"}`;
      const requestedTime = Number(params.get("t") ?? 0);
      video.addEventListener("loadedmetadata", () => {
        video.currentTime = Math.min(requestedTime, Math.max(0, video.duration - 0.05));
      });
      video.addEventListener("seeked", () => {
        video.pause();
        output.textContent = `${video.currentTime.toFixed(1)} s / ${video.duration.toFixed(1)} s`;
        document.body.dataset.ready = "true";
      });
    </script>
  </body>
</html>
